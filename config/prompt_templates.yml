model:
  hf_repo: mlx-community/supertonic-3
  source_space: mlx-community/supertonic-3
  runtime: local SupertonicMLX graph executor

generation_defaults:
  lang: en
  voice: M1
  total_step: 8
  speed: 1.05
  seed: -1
  silence_duration: 0.3
  open_after: false

parameter_reference:
  lang: "Language tag prepended to the text. Use na when the text may mix languages."
  voice: "Preset voice embedding from voice_styles. M1-M5 are male-coded presets, F1-F5 are female-coded presets."
  total_step: "Flow-matching refinement steps. 5 is fast, 8 is balanced, 12 is higher quality."
  speed: "Speaking rate multiplier. Lower is slower; higher is faster. Practical range is 0.7-2.0."
  seed: "Use -1 for a fresh random seed, or an integer for repeatable output."
  silence_duration: "Seconds inserted between chunks when the input text is split."

languages:
  - { code: en, name: English }
  - { code: es, name: Spanish }
  - { code: ko, name: Korean }
  - { code: ja, name: Japanese }
  - { code: fr, name: French }
  - { code: de, name: German }
  - { code: it, name: Italian }
  - { code: pt, name: Portuguese }
  - { code: nl, name: Dutch }
  - { code: pl, name: Polish }
  - { code: ru, name: Russian }
  - { code: sv, name: Swedish }
  - { code: tr, name: Turkish }
  - { code: uk, name: Ukrainian }
  - { code: vi, name: Vietnamese }
  - { code: ar, name: Arabic }
  - { code: bg, name: Bulgarian }
  - { code: cs, name: Czech }
  - { code: da, name: Danish }
