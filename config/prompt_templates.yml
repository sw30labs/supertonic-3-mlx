voices:
  - { id: M1, label: M1, description: Clear male narrator }
  - { id: M2, label: M2, description: Warm male presenter }
  - { id: M3, label: M3, description: Low male storyteller }
  - { id: M4, label: M4, description: Bright male explainer }
  - { id: M5, label: M5, description: Relaxed male voice }
  - { id: F1, label: F1, description: Clear female narrator }
  - { id: F2, label: F2, description: Warm female presenter }
  - { id: F3, label: F3, description: Calm female storyteller }
  - { id: F4, label: F4, description: Bright female explainer }
  - { id: F5, label: F5, description: Relaxed female voice }

text_presets:
  - label: Product
    text: "Welcome to the local Supertonic 3 MLX studio. Type any script, pick a voice, and generate clean speech on-device."
  - label: Audiobook
    text: "The room was quiet except for the rain against the window. She turned the page slowly, already knowing the next sentence would change everything."
  - label: News
    text: "Here is a quick update. Supertonic 3 now runs as a compact multilingual text-to-speech model with local MLX inference."
  - label: Character
    text: "<breath> I was waiting for the right moment to tell you. This city remembers every secret we tried to leave behind."
  - label: Spanish
    text: "Buenos dias. Esta es una prueba local de Supertonic 3 usando MLX en Apple Silicon."

surprise_texts:
  - "A tiny local model can still sound enormous when the timing, voice, and silence are handled carefully."
  - "This is a short narration test with a warm delivery, clean pacing, and a calm ending."
  - "Good morning. The build completed successfully, and the next step is to listen for clarity, rhythm, and tone."
  - "<sigh> Sometimes the smallest tools are the ones that make a workflow feel alive again."
  - "En una tarde tranquila, la voz encontro su camino entre las palabras y la musica del silencio."

