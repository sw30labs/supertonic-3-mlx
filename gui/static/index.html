<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supertonic 3 MLX</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Supertonic 3 MLX</h1>
        <p id="modelLine">mlx-community/supertonic-3</p>
      </div>
      <div class="status-pill" id="statusPill">Ready</div>
    </header>

    <main class="workspace">
      <section class="panel composer">
        <div class="section-head">
          <h2>Text</h2>
          <div class="button-row" id="presetButtons"></div>
        </div>

        <textarea id="text" spellcheck="true"></textarea>

        <div class="section-head voice-head">
          <h2>Voice</h2>
          <div class="button-row">
            <button id="surpriseButton" type="button">Surprise</button>
            <button id="clearButton" type="button">Clear</button>
          </div>
        </div>
        <div class="voice-grid" id="voiceButtons"></div>

        <div class="settings-grid">
          <div>
            <label for="lang">Language</label>
            <select id="lang"></select>
          </div>
          <div>
            <label for="totalStep">Steps</label>
            <input id="totalStep" type="number" min="5" max="12" step="1" value="8" />
          </div>
          <div>
            <label for="speed">Speed</label>
            <input id="speed" type="number" min="0.7" max="2" step="0.05" value="1.05" />
          </div>
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="-1" />
          </div>
          <div>
            <label for="silenceDuration">Silence</label>
            <input id="silenceDuration" type="number" min="0" max="3" step="0.1" value="0.3" />
          </div>
        </div>

        <button class="primary generate" id="generateButton">Generate Speech</button>
      </section>

      <section class="panel output">
        <div class="section-head">
          <h2>Output</h2>
          <span id="metrics"></span>
        </div>

        <div class="audio-stage">
          <div class="wave-lines" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <audio id="audioPlayer" controls></audio>
          <div class="empty-output" id="emptyOutput">No audio yet</div>
        </div>

        <details open>
          <summary>Logs</summary>
          <pre id="logs"></pre>
        </details>

        <div class="reference">
          <h2>Parameters</h2>
          <dl id="parameterReference"></dl>
        </div>
      </section>

      <section class="panel recent">
        <h2>Recent</h2>
        <div id="recentList"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
